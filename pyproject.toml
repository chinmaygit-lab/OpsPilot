[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-agent-platform"
version = "0.1.0"
description = "Multi-tenant operations control plane with agent tools, event ingestion and live analytics"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7"]
mcp = ["mcp>=2,<3"]

[tool.setuptools.packages.find]
include = ["opspilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
opspilot = ["static/*.html", "static/*.css", "static/*.js"]
